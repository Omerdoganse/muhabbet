<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <title>Muhabbet</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body {
      display: grid; place-items: center; font-family: 'Segoe UI', system-ui, sans-serif; color: #3b3355;
      background: linear-gradient(135deg, #fde2f3 0%, #e7e3ff 50%, #dff3ff 100%);
    }
    .box { text-align: center; }
    .bot { font-size: 72px; animation: float 2s ease-in-out infinite; }
    h1 { margin: 8px 0 4px; }
    p { color: #8a84a3; margin: 0; }
    .dots span { display: inline-block; width: 10px; height: 10px; margin: 14px 4px 0; border-radius: 50%; background: #7c5cff; animation: bounce 1s infinite; }
    .dots span:nth-child(2) { animation-delay: .15s; background: #ff7eb6; }
    .dots span:nth-child(3) { animation-delay: .3s; background: #4cc3ff; }
    @keyframes float { 50% { transform: translateY(-10px) rotate(-4deg); } }
    @keyframes bounce { 50% { transform: translateY(-8px); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="bot">🤖</div>
    <h1>Muhabbet</h1>
    <p>Sunucuya bağlanılıyor… (ilk açılış 1 dakika sürebilir)</p>
    <div class="dots"><span></span><span></span><span></span></div>
  </div>
</body>
</html>
